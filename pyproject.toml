[project]
name = "pengelolaan-citra"
version = "0.1.0"
description = "Tugas dan eksperimen Pengolahan Citra Digital"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "pyyaml",
    "tqdm",
    "jupyter",
    "mahotas>=1.4.19",
]

[project.optional-dependencies]
dl = ["torch", "torchvision"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
